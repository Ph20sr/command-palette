<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>command-palette · demo</title>
  <style>
    :root { color-scheme: light dark; --bg: #fafafa; --fg: #18181b; --muted: #71717a; --card: #fff; --border: #e4e4e7; }
    @media (prefers-color-scheme: dark) { :root { --bg: #09090b; --fg: #fafafa; --muted: #a1a1aa; --card: #18181b; --border: #27272a; } }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; background: var(--bg); color: var(--fg); font: 15px/1.6 system-ui, sans-serif; display: grid; place-items: center; padding: 16px; }
    main { max-width: 560px; text-align: center; }
    h1 { font-size: clamp(28px, 6vw, 40px); margin: 0 0 8px; letter-spacing: -.02em; }
    p { color: var(--muted); margin: 0 0 24px; }
    button { font: inherit; padding: 12px 18px; border-radius: 10px; border: 1px solid var(--border); background: var(--card); color: inherit; cursor: pointer; display: inline-flex; gap: 10px; align-items: center; }
    kbd { font: 12px ui-monospace, monospace; border: 1px solid var(--border); border-radius: 5px; padding: 2px 6px; color: var(--muted); }
    #log { margin-top: 24px; min-height: 24px; color: var(--muted); font-size: 14px; }
  </style>
</head>
<body>
  <main>
    <h1>command-palette</h1>
    <p>Web Component sem dependências. Busca fuzzy que ignora acentos, atalhos de teclado e histórico de recentes.</p>
    <button id="trigger" type="button">Abrir paleta <kbd>Ctrl</kbd><kbd>K</kbd></button>
    <div id="log" aria-live="polite"></div>
  </main>

  <command-palette></command-palette>

  <script type="module">
    import '../src/command-palette.js';

    const palette = document.querySelector('command-palette');
    const log = (msg) => { document.getElementById('log').textContent = msg; };
    const go = (label) => () => log(`→ ${label}`);

    palette.commands = [
      { id: 'lead:new', section: 'Ações', title: 'Novo lead', icon: '＋', shortcut: 'N', keywords: ['criar', 'contato', 'oportunidade'], run: go('Formulário de novo lead') },
      { id: 'invoice:new', section: 'Ações', title: 'Emitir cobrança', icon: '₢', keywords: ['boleto', 'pix', 'fatura', 'asaas'], run: go('Nova cobrança') },
      { id: 'ticket:new', section: 'Ações', title: 'Abrir ticket de suporte', icon: '✉', keywords: ['chamado', 'atendimento', 'helpdesk'], run: go('Novo ticket') },
      { id: 'nav:pipeline', section: 'Navegação', title: 'Pipeline de vendas', icon: '▤', shortcut: 'G P', keywords: ['funil', 'kanban', 'negócios'], run: go('Pipeline') },
      { id: 'nav:clients', section: 'Navegação', title: 'Clientes', icon: '☺', shortcut: 'G C', keywords: ['contas', 'empresas'], run: go('Clientes') },
      { id: 'nav:billing', section: 'Navegação', title: 'Financeiro', subtitle: 'cobranças e assinaturas', icon: '$', shortcut: 'G F', keywords: ['faturamento', 'inadimplência'], run: go('Financeiro') },
      { id: 'nav:tickets', section: 'Navegação', title: 'Tickets e SLA', icon: '⏱', shortcut: 'G T', keywords: ['suporte', 'prazo'], run: go('Tickets') },
      { id: 'nav:reports', section: 'Navegação', title: 'Relatórios', icon: '◔', keywords: ['dashboard', 'métricas', 'mrr'], run: go('Relatórios') },
      { id: 'settings:integrations', section: 'Configurações', title: 'Integrações', subtitle: 'WhatsApp, webhooks, Asaas', icon: '⚙', keywords: ['api', 'token'], run: go('Integrações') },
      { id: 'settings:team', section: 'Configurações', title: 'Usuários e permissões', icon: '⚙', keywords: ['equipe', 'acesso'], run: go('Equipe') },
      { id: 'settings:notifications', section: 'Configurações', title: 'Notificações', icon: '⚙', keywords: ['alertas', 'email'], run: go('Notificações') },
    ];

    document.getElementById('trigger').addEventListener('click', () => palette.open());
  </script>
</body>
</html>
